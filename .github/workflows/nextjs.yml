name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

# Read-only token: this workflow checks and builds the code. Deployment is done by Vercel.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Values come from the "production" environment (Settings → Environments). Secrets are
    # masked in logs, and variables are plain configuration.
    environment: production
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      CONTACT_TO: ${{ vars.CONTACT_TO }}
      # Accepts the value whether it was added as a variable or (by mistake) as a secret.
      GMAIL_USER: ${{ vars.GMAIL_USER || secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Check required configuration
        # Reports which values are missing by name only; the values are never printed.
        run: |
          missing=0
          for name in NEXT_PUBLIC_SITE_URL GMAIL_USER GMAIL_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under the production environment."
              missing=1
            fi
          done
          exit $missing

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and format
        run: npm run check

      - name: Build
        run: npm run build
